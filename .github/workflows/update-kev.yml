name: Update KEV data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-kev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch latest CISA KEV catalog
        run: |
          set -x
          mkdir -p easycve/data
          curl -sSL -f \
            -A "Mozilla/5.0 (compatible; EasyCVE-Sync/1.0; +https://github.com/${{ github.repository }})" \
            "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json" \
            -o easycve/data/kev.json.tmp

          echo "--- First 200 chars of downloaded file ---"
          head -c 200 easycve/data/kev.json.tmp
          echo ""

          if node -e "
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('easycve/data/kev.json.tmp', 'utf8'));
            if (!Array.isArray(d.vulnerabilities)) process.exit(1);
            console.log('Validated ' + d.vulnerabilities.length + ' vulnerabilities.');
          "; then
            mv easycve/data/kev.json.tmp easycve/data/kev.json
          else
            echo "Downloaded file failed validation, keeping previous easycve/data/kev.json"
            rm -f easycve/data/kev.json.tmp
            exit 1
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add easycve/data/kev.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sync KEV catalog $(date -u +%Y-%m-%d)"
            git push
          fi
